name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python linting with Ruff
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Python (ruff)
        run: ruff check scripts/ --output-format=github
        continue-on-error: true  # Don't block build initially

      # JavaScript linting with ESLint
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install ESLint
        run: npm install eslint@8

      - name: Lint JavaScript (eslint)
        run: npx eslint scripts/*.js --format stylish
        continue-on-error: true  # Don't block build initially

  lint-swift:
    name: Lint Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift (swiftlint)
        run: swiftlint lint --reporter github-actions-logging
        continue-on-error: true  # Don't block build initially

  parser-tests:
    name: Parser Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip3 install -r requirements.txt
          pip3 install pytest pytest-cov

      - name: Test parser on all fixtures
        run: |
          echo "Testing parser on all fixtures..."
          for docx in fixtures/*.docx; do
            echo "Parsing: $docx"
            python3 scripts/parse_docx.py "$docx" > /dev/null
            if [ $? -ne 0 ]; then
              echo "FAIL: $docx"
              exit 1
            fi
            echo "OK: $docx"
          done
          echo "All fixtures parsed successfully."

      - name: Run Python tests with coverage
        run: |
          pytest scripts/test_parse_docx_unit.py scripts/test_parser_golden.py scripts/test_edge_cases.py \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload Python coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  js-unit-tests:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run JS unit tests
        run: node scripts/test_pages_writer_unit.js

  build-macos:
    name: Build (macOS ${{ matrix.macos }})
    strategy:
      matrix:
        macos: [macos-13, macos-14]
    runs-on: ${{ matrix.macos }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: swift build -c release

      - name: CLI version check
        run: |
          .build/release/docx2pages --version

      - name: CLI help check
        run: |
          .build/release/docx2pages --help

      - name: CLI surface contract
        run: |
          # Verify expected options exist in help output
          HELP=$(.build/release/docx2pages --help)
          echo "$HELP" | grep -q -- "--input" || (echo "Missing --input"; exit 1)
          echo "$HELP" | grep -q -- "--output" || (echo "Missing --output"; exit 1)
          echo "$HELP" | grep -q -- "--template" || (echo "Missing --template"; exit 1)
          echo "$HELP" | grep -q -- "--strict" || (echo "Missing --strict"; exit 1)
          echo "$HELP" | grep -q -- "--json-summary" || (echo "Missing --json-summary"; exit 1)
          echo "$HELP" | grep -q -- "--no-wait" || (echo "Missing --no-wait"; exit 1)
          echo "$HELP" | grep -q -- "--no-lock" || (echo "Missing --no-lock"; exit 1)
          echo "$HELP" | grep -q -- "--verbose" || (echo "Missing --verbose"; exit 1)
          echo "$HELP" | grep -q -- "--force-text" || (echo "Missing --force-text"; exit 1)
          echo "$HELP" | grep -q -- "--timeout" || (echo "Missing --timeout"; exit 1)
          echo "CLI surface contract verified."

      - name: Run Swift unit tests with coverage
        run: swift test --enable-code-coverage

      - name: Generate Swift coverage report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find $BIN_PATH -name '*.xctest' -type d | head -1)
          if [ -n "$XCTEST_PATH" ]; then
            COV_DATA=$(find .build -name 'default.profdata' -type f | head -1)
            if [ -n "$COV_DATA" ]; then
              echo "=== Swift Code Coverage Summary ==="
              xcrun llvm-cov report "$XCTEST_PATH/Contents/MacOS/docx2pagesPackageTests" \
                -instr-profile="$COV_DATA" \
                -ignore-filename-regex='.build|Tests' 2>/dev/null || \
              xcrun llvm-cov report "$BIN_PATH/docx2pagesPackageTests.xctest/Contents/MacOS/docx2pagesPackageTests" \
                -instr-profile="$COV_DATA" \
                -ignore-filename-regex='.build|Tests' 2>/dev/null || \
              echo "Could not generate coverage report (binary structure may differ)"
            fi
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: docx2pages-${{ matrix.macos }}
          path: .build/release/docx2pages
          retention-days: 7
